server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # MapLibre's versioned module worker must be served as JavaScript, never
    # the SPA fallback or an octet-stream (module workers enforce MIME types).
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://api:8080;
        add_header X-Robots-Tag "noindex" always;
        proxy_set_header Host $host;
        # Trust this immediate peer only; discard client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /denunciar { try_files /denunciar/index.html =404; }
    location = /tendencias { try_files /tendencias/index.html =404; }
    location = /denunciar/ { return 308 /denunciar$is_args$args; }
    location = /tendencias/ { return 308 /tendencias$is_args$args; }
    location = /metodologia { return 308 /metodologia/$is_args$args; }
    location = /estadisticas/peru { return 308 /estadisticas/peru/$is_args$args; }
    location ~ ^/estadisticas/departamentos/[a-z0-9-]+$ { return 308 $uri/$is_args$args; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/index.html =404; }
}
